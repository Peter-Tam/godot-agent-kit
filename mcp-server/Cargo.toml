[package]
name = "godot-agent-kit"
version = "0.1.0"
edition = "2021"

[lib]
name = "godot_agent_kit"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
cap-std = { version = "=4.0.3", default-features = false }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time", "sync", "io-util", "io-std"] }

[[bin]]
name = "observe-gdscript"
path = "src/bin/observe-gdscript.rs"

[[bin]]
name = "edit-gdscript"
path = "src/bin/edit-gdscript.rs"

[[bin]]
name = "open-gdscript"
path = "src/bin/open-gdscript.rs"

[[bin]]
name = "discover-gdscripts"
path = "src/bin/discover-gdscripts.rs"

[[bin]]
name = "close-gdscript"
path = "src/bin/close-gdscript.rs"

[[bin]]
name = "godot-agent-kit-mcp"
path = "src/bin/godot-agent-kit-mcp.rs"
