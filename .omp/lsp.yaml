servers:
  rust-analyzer:
    # Resolve through the nested project's toolchain, not the root's default toolchain.
    command: sh
    args:
      - -c
      - 'cd mcp-server && exec "$(rustup which rust-analyzer)"'
    # OMP checks markers at its launch directory; linkedProjects scopes Cargo analysis.
    rootMarkers: ["mcp-server/Cargo.toml"]
    initOptions:
      linkedProjects: ["mcp-server/Cargo.toml"]
    # Configuration pulls replace initOptions; keep the nested workspace selected.
    settings:
      rust-analyzer:
        linkedProjects: ["mcp-server/Cargo.toml"]
        # Preserve OMP's default when overriding its rust-analyzer settings.
        checkOnSave: false
