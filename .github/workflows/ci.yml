name: CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/tests/**
      - .github/actionlint.yaml
      - godot-addon/**
      - mcp-server/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/tests/**
      - .github/actionlint.yaml
      - godot-addon/**
      - mcp-server/**
  workflow_dispatch:

# Replace older runs for the same PR/ref without mixing automatic and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep shared-boundary checks as jobs; expand path filters only with matching coverage.
jobs:
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-validation"
          "$RUNNER_TEMP/workflow-validation/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Exercise trust-gate decisions and validate workflows
        run: |
          "$RUNNER_TEMP/workflow-validation/bin/python" -m unittest discover -s .github/tests -v
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  rust-native:
    name: Rust native
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify native runner and toolchain
        working-directory: mcp-server
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          test "$(uname -m)" = arm64
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          test "$(rustc --version)" = 'rustc 1.98.1 (48a229cea 2026-09-01)'
          test "$(rustc --print host-tuple)" = aarch64-apple-darwin
      - name: Verify native library, caller, and documentation
        working-directory: mcp-server
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo doc --no-deps --locked
          cargo build --locked --bin observe-gdscript --bin edit-gdscript --bin open-gdscript

  editor-native:
    name: Stock native build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check native ABI refusal boundaries
        run: python3 -m unittest discover -s godot-addon/tests -p test_native_build.py -v
      - name: Acquire the pinned official stock editor
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip \
            --output "$RUNNER_TEMP/stock-editor.zip"
          test "$(shasum -a 256 "$RUNNER_TEMP/stock-editor.zip" | cut -d ' ' -f1)" = c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
          ditto -x -k "$RUNNER_TEMP/stock-editor.zip" "$RUNNER_TEMP/stock-editor"
          test "$(shasum -a 256 "$RUNNER_TEMP/stock-editor/Godot.app/Contents/MacOS/Godot" | cut -d ' ' -f1)" = c7cccbf8fb143e34e02fd6521e09be2c2b974f0d5db080b19071c9c570718ccf
      - name: Build the official-stock public-ABI extension
        run: |
          python3 godot-addon/native/build.py \
            --godot "$RUNNER_TEMP/stock-editor/Godot.app/Contents/MacOS/Godot"
