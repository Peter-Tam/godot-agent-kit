name: CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/tests/**
      - .github/actionlint.yaml
      - mcp-server/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/tests/**
      - .github/actionlint.yaml
      - mcp-server/**
  workflow_dispatch:

# Replace older runs for the same PR/ref without mixing automatic and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep shared-boundary checks as jobs; expand path filters only with matching coverage.
jobs:
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-validation"
          "$RUNNER_TEMP/workflow-validation/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Exercise trust-gate decisions and validate workflows
        run: |
          "$RUNNER_TEMP/workflow-validation/bin/python" -m unittest discover -s .github/tests -v
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  rust-native:
    name: Rust native
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify native runner and toolchain
        working-directory: mcp-server
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          test "$(uname -m)" = arm64
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          test "$(rustc --version)" = 'rustc 1.98.1 (48a229cea 2026-09-01)'
          test "$(rustc --print host-tuple)" = aarch64-apple-darwin
      - name: Verify native library, caller, and documentation
        working-directory: mcp-server
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo doc --no-deps --locked
          cargo build --locked --bin observe-gdscript
