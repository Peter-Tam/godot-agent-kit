name: Live editor
run-name: Live editor at ${{ inputs.reviewed_sha }}

# No PR, pull_request_target, workflow_run, or automatic self-hosted execution.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full lowercase SHA of the dispatch main revision or an independently approved PR head
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-editor
  cancel-in-progress: false

jobs:
  trust-gate:
    name: Verify reviewed revision and environment protections
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Read environment configuration and deployment branch policies.
      pull-requests: read # Read commit associations, PR heads, and exact-SHA reviews.
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      # No checkout or repository code runs before the protection check.
      - name: Authorize only main or an independently reviewed exact PR head
        id: verify
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          import json
          import os
          import re
          import urllib.request

          repository = "Peter-Tam/godot-agent-kit"
          if (os.environ["GITHUB_REPOSITORY"] != repository
                  or os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
                  or os.environ["GITHUB_REF"] != "refs/heads/main"
                  or os.environ["GITHUB_WORKFLOW_REF"] !=
                  repository + "/.github/workflows/live-editor.yml@refs/heads/main"):
              raise SystemExit("Only the trusted main workflow may authorize GUI execution")
          revision = os.environ["REVIEWED_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("reviewed_sha must be a full lowercase 40-character commit SHA")
          base = "https://api.github.com/repos/" + repository
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          def get_list(path):
              records = []
              for page in range(1, 101):
                  batch = get(f"{path}?per_page=100&page={page}")
                  if not isinstance(batch, list) or len(batch) > 100:
                      raise SystemExit("Invalid paginated GitHub response")
                  records.extend(batch)
                  if len(batch) < 100:
                      return records
              raise SystemExit("Cannot authorize with incomplete GitHub pagination")

          def identity(value):
              if type(value) is not int or value <= 0:
                  raise SystemExit("Missing or invalid GitHub identity")
              return value

          def eligible(pr):
              head, target = pr["head"], pr["base"]
              return (pr["state"] == "open" and pr["draft"] is False
                      and pr["merged_at"] is None and target["ref"] == "main"
                      and (target["repo"] or {}).get("full_name") == repository
                      and (head["repo"] or {}).get("full_name") == repository
                      and head["sha"] == revision)

          def current_pr(number):
              pr = get(f"/pulls/{number}")
              if pr["number"] != number or not eligible(pr) or pr["merged"] is not False:
                  raise SystemExit("PR is no longer an eligible exact head")
              return pr

          if revision != os.environ["GITHUB_SHA"]:
              associated = get_list(f"/commits/{revision}/pulls")
              numbers = [identity(pr["number"]) for pr in associated]
              if len(numbers) != len(set(numbers)):
                  raise SystemExit("Ambiguous duplicate PR association")
              candidates = [pr for pr in associated if eligible(pr)]
              if len(candidates) != 1:
                  raise SystemExit("Require exactly one eligible same-repository PR head")
              number = candidates[0]["number"]
              pr = current_pr(number)
              author = identity(pr["user"]["id"])
              latest, pending, ambiguous, seen = {}, set(), set(), set()
              for review in get_list(f"/pulls/{number}/reviews"):
                  review_id = identity(review["id"])
                  if review_id in seen:
                      raise SystemExit("Ambiguous duplicate review record")
                  seen.add(review_id)
                  reviewer = identity(review["user"]["id"])
                  state = review["state"]
                  if state == "PENDING":
                      pending.add(reviewer)
                      continue
                  if state not in {"APPROVED", "CHANGES_REQUESTED", "COMMENTED", "DISMISSED"}:
                      raise SystemExit("Unknown review state")
                  submitted = datetime.strptime(review["submitted_at"], "%Y-%m-%dT%H:%M:%SZ")
                  previous = latest.get(reviewer)
                  if previous is None or submitted > previous[0]:
                      latest[reviewer] = (submitted, review)
                      ambiguous.discard(reviewer)
                  elif submitted == previous[0]:
                      ambiguous.add(reviewer)
              # Reduce all states/commits first; never resurrect an older approval.
              if not any(reviewer != author and reviewer not in pending | ambiguous
                         and review["state"] == "APPROVED" and review["commit_id"] == revision
                         for reviewer, (_, review) in latest.items()):
                  raise SystemExit("Require a current independent approval of this exact SHA")
              if identity(current_pr(number)["user"]["id"]) != author:
                  raise SystemExit("PR identity changed during review validation")
              print(f"Validated PR #{number} head {revision}")

          # GITHUB_TOKEN actions:read supports both environment GET endpoints.
          # GitHub itself enforces the independent approval before scheduling the GUI job.
          environment = get("/environments/live-editor")
          reviewers = [rule for rule in environment.get("protection_rules", [])
                       if rule.get("type") == "required_reviewers"]
          if not any(rule.get("reviewers") and rule.get("prevent_self_review") is True for rule in reviewers):
              raise SystemExit("live-editor requires reviewers and prevention of self-review")
          policy = environment.get("deployment_branch_policy") or {}
          if policy.get("custom_branch_policies") is not True or policy.get("protected_branches") is not False:
              raise SystemExit("live-editor requires an exact main-only deployment policy")
          branches = get("/environments/live-editor/deployment-branch-policies")
          rules = branches.get("branch_policies", [])
          if branches.get("total_count") != 1 or len(rules) != 1 or rules[0].get("name") != "main" or rules[0].get("type") != "branch":
              raise SystemExit("live-editor must permit only the main branch, not tags")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("revision=" + revision + "\n")
          PY

  live-editor:
    name: Reviewed exact-version GUI acceptance
    needs: trust-gate
    # Provision only a clean, dedicated one-job GUI runner under this label.
    # It must contain no human projects, credentials, or privileged network access.
    runs-on: [self-hosted, macOS, ARM64, godot-live-editor-ephemeral]
    environment: live-editor
    timeout-minutes: 20
    steps:
      - name: Check out only the approved immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.trust-gate.outputs.revision }}
          persist-credentials: false
      - name: Verify checked-out HEAD before executing repository code
        env:
          VALIDATED_REVISION: ${{ needs.trust-gate.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_REVISION"
      - name: Verify provisioned GUI candidate and build the caller
        working-directory: mcp-server
        run: |
          test "$(sw_vers -productVersion)" = 26.6.2
          test "$(uname -m)" = arm64
          test "$(godot --version)" = 4.7.2.stable.official.ed1daf0bf
          test "$(rustc --version)" = 'rustc 1.98.1 (48a229cea 2026-09-01)'
          test "$(rustc --print host-tuple)" = aarch64-apple-darwin
          cargo build --locked --lib --bin observe-gdscript
      - name: Exercise the real editor with independent witnesses
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/observation-evidence"
          python3 godot-addon/tests/run_observation.py \
            --godot "$(command -v godot)" \
            --observer "$GITHUB_WORKSPACE/mcp-server/target/debug/observe-gdscript" \
            --scenario all --artifacts "$RUNNER_TEMP/observation-evidence"
      - name: Retain explicit synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observation-all-${{ github.run_id }}
          path: ${{ runner.temp }}/observation-evidence/
          if-no-files-found: error
          retention-days: 14
